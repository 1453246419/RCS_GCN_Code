[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs-gcn"
version = "0.1.0"
description = "Code-only research release for skeleton-based MG severity grading"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["rcsgcn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

